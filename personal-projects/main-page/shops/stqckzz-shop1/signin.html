<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="signin.css">
    <title>Sign In - EBK's Customs</title>
</head>
<body>
    <header>
        <div class="navbar">
            <h1>EBK's Customs</h1>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="products.html">Products</a></li>
                    <li><a href="cart.html">Cart</a></li>
                    <li><a href="signin.html" id="signin-link">Sign In</a></li>
                    <li><a href="signup.html">Create Account</a></li>
                    <li><img id="profile-pic" src="" alt="Profile Picture" style="width: 40px; height: 40px; border-radius: 50%;"></li>
                </ul>
            </nav>
        </div>
        <div id="auth-status" class="auth-status"></div>
    </header>
    <main>
        <h2>Sign In</h2>
        <form>
            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email" required><br>
            <label for="password">Password:</label><br>
            <input type="password" id="password" name="password" required><br>
            <button type="submit">Sign In</button>
        </form>
    </main>
    <footer>
        <p>&copy; 2024 EBK's Customs</p>
    </footer>
</body>
